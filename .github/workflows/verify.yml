name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  public-case-study:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install verifier dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep
      - name: Check verification syntax
        run: bash -n tests/verify.sh
      - name: Verify public artifacts
        run: bash tests/verify.sh
